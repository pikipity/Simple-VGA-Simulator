name: Build Release

# main 分支：四平台构建 + 冒烟 + 自动创建 Release 分发
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            exe: simple-vga-simulator.exe
          - os: macos-14
            target: macos-arm64
            exe: simple-vga-simulator
          - os: ubuntu-22.04
            target: linux
            exe: simple-vga-simulator
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: simple-vga-simulator

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies and build
        run: |
          uv sync --group dev
          uv run pyinstaller main.spec --noconfirm --clean

      - name: Smoke test (basic)
        shell: bash
        env:
          VGA_BOARD_NO_BROWSER: "1"
          VGA_BOARD_PORT: "8899"
          VGA_BOARD_TOKEN: "ci-token"
          VGA_BOARD_WATCHDOG_TIMEOUT: "600"
        run: |
          ./dist/simple-vga-simulator/${{ matrix.exe }} &
          sleep 3
          python tests/ci_smoke.py --port 8899 --token ci-token

      - name: Full E2E (Linux x64: verilator/yosys/g++ + real compile & program)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y verilator yosys g++
          VGA_BOARD_NO_BROWSER=1 VGA_BOARD_PORT=8899 VGA_BOARD_TOKEN=ci-token \
            VGA_BOARD_WATCHDOG_TIMEOUT=600 \
            ./dist/simple-vga-simulator/simple-vga-simulator &
          sleep 3
          python tests/ci_smoke.py --port 8899 --token ci-token --full

      - name: Package zip
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.target }}" = "windows" ]; then
            python -c "import shutil; shutil.make_archive('release/simple-vga-simulator-${{ matrix.target }}', 'zip', 'dist/simple-vga-simulator')"
          else
            (cd dist/simple-vga-simulator && zip -r "$GITHUB_WORKSPACE/release/simple-vga-simulator-${{ matrix.target }}.zip" .)
          fi
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-vga-simulator-${{ matrix.target }}
          path: release/*.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: List release files
        run: ls -lh release/*/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Simple VGA Simulator v2.0.${{ github.run_number }}
          body: |
            ## Simple VGA Simulator v2.0.${{ github.run_number }}

            v2 架构：本地后端 + 浏览器前端（虚拟开发板实验台），免安装解压即用。无需虚拟机、无需 SDL2。

            ### 下载

            | 文件 | 平台 |
            |------|------|
            | `simple-vga-simulator-windows.zip` | Windows 10/11 (x64) |
            | `simple-vga-simulator-macos-arm64.zip` | macOS (Apple Silicon) |
            | `simple-vga-simulator-linux.zip` | Linux x64 (Ubuntu 22.04+) |
            | `simple-vga-simulator-linux-arm64.zip` | Linux ARM64 |

            ### 使用

            1. 解压后双击运行，浏览器自动打开 EDA 工具页
            2. 需预装工具：verilator ≥ 4.0 / yosys ≥ 0.9 / g++ ≥ 7
               （Windows 经 MSYS2：`pacman -S mingw-w64-x86_64-verilator mingw-w64-x86_64-gcc mingw-w64-x86_64-yosys`）
            3. 详见仓库内《Manual for EIE330 Students.md》

            ### 构建信息

            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
          files: release/*/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
