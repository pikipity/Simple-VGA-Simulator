name: Build Test (dev)

# dev / v2-web-board 分支：四平台构建 + 冒烟，只产出 artifacts，不创建 Release
on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            exe: simple-vga-simulator.exe
          - os: macos-14
            target: macos-arm64
            exe: simple-vga-simulator
          - os: ubuntu-22.04
            target: linux
            exe: simple-vga-simulator
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: simple-vga-simulator

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies and build
        run: |
          uv sync --group dev
          uv run pyinstaller main.spec --noconfirm --clean

      - name: Smoke test (basic)
        shell: bash
        env:
          VGA_BOARD_NO_BROWSER: "1"
          VGA_BOARD_PORT: "8899"
          VGA_BOARD_TOKEN: "ci-token"
          VGA_BOARD_WATCHDOG_TIMEOUT: "600"
        run: |
          ./dist/simple-vga-simulator/${{ matrix.exe }} &
          sleep 3
          python tests/ci_smoke.py --port 8899 --token ci-token

      - name: Full E2E (Linux x64: verilator/yosys/g++ + real compile & program)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y verilator yosys g++
          VGA_BOARD_NO_BROWSER=1 VGA_BOARD_PORT=8899 VGA_BOARD_TOKEN=ci-token \
            VGA_BOARD_WATCHDOG_TIMEOUT=600 \
            ./dist/simple-vga-simulator/simple-vga-simulator &
          sleep 3
          python tests/ci_smoke.py --port 8899 --token ci-token --full

      - name: Package zip
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.target }}" = "windows" ]; then
            python -c "import shutil; shutil.make_archive('release/simple-vga-simulator-${{ matrix.target }}', 'zip', 'dist/simple-vga-simulator')"
          else
            (cd dist/simple-vga-simulator && zip -r "$GITHUB_WORKSPACE/release/simple-vga-simulator-${{ matrix.target }}.zip" .)
          fi
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-vga-simulator-${{ matrix.target }}
          path: release/*.zip
          retention-days: 30
